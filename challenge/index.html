<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contacts</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="tokens.css">
</head>
<body>
  <main class="container app-shell">
    <header class="d-flex justify-content-between align-items-center mb-4">
      <h1 class="app-title">Contacts</h1>
      <button type="button" class="btn btn-primary">Add contact</button>
    </header>

    <ul id="contact-list" class="list-group app-list"></ul>
  </main>

  <script src="data.js"></script>
  <script>
    // Renders the contact list
    const list = document.getElementById('contact-list');

    function render(items) {
      items.forEach(function (c) {
        const item = document.createElement('li');
        item.className = 'list-group-item d-flex justify-content-between align-items-center';
        item.innerHTML =
          '<div><div class="contact-name">' + c.name + '</div>' +
          '<div class="contact-detail">' + c.phone + '</div></div>' +
          '<span class="badge-label">' + c.label + '</span>';
        list.appendChild(item);
      });
    }

    loadContacts().then(render);
  </script>
</body>
</html>
